name: Pi extension contract

on:
  push:
    paths:
      - "pi-extension/**"
      - "package.json"
      - ".github/workflows/pi-extension-contract.yml"
  pull_request:
    paths:
      - "pi-extension/**"
      - "package.json"
      - ".github/workflows/pi-extension-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source contract
        run: node pi-extension/contract.test.mjs
      - name: Verify Pi package manifest
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.1.0') throw new Error('unexpected package version'); if(!p.pi?.extensions?.includes('./pi-extension/index.ts')) throw new Error('Pi extension resource missing'); if(p.dependencies?.typebox!=='1.3.27') throw new Error('typebox runtime dependency must match Pi 1.0.4 baseline')"
      - name: Install package runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install CI-only bundler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund esbuild@0.25.10
      - name: Bundle extension for runtime tests
        run: |
          mkdir -p pi-extension/.ci
          npx esbuild pi-extension/index.ts --bundle --platform=node --format=esm --outfile=pi-extension/.ci/index.mjs
      - name: Verify native Pi lifecycle behavior
        run: node pi-extension/runtime.test.mjs

name: Claude-mem Viewer contract
on:
  push:
    paths:
      - 'deploy/apply-claude-mem-viewer-branding.mjs'
      - 'deploy/react-mywork-compat.mjs'
      - 'deploy/agent-icons/**'
      - 'tests/work-view-branding.test.mjs'
      - 'deploy/reapply-claude-mem-platform-ui.py'
      - 'deploy/test_platform_ui_patch.py'
      - 'deploy/claude-mem-weekly-update.sh'
      - 'deploy/test_updater_contract.py'
      - 'deploy/check-worker-upgrade.mjs'
      - 'deploy/check-worker-upgrade.test.mjs'
      - 'deploy/worker-upgrade-policy.json'
      - 'deploy/nginx-claude-mem-*.conf.example'
      - 'deploy/test_public_worker_proxy.py'
      - 'docs/REMOTE_WORKER_SURFACE.md'
      - '.github/workflows/claude-mem-platform-ui-contract.yml'
  pull_request:
    paths:
      - 'deploy/apply-claude-mem-viewer-branding.mjs'
      - 'deploy/react-mywork-compat.mjs'
      - 'deploy/agent-icons/**'
      - 'tests/work-view-branding.test.mjs'
      - 'deploy/reapply-claude-mem-platform-ui.py'
      - 'deploy/test_platform_ui_patch.py'
      - 'deploy/claude-mem-weekly-update.sh'
      - 'deploy/test_updater_contract.py'
      - 'deploy/check-worker-upgrade.mjs'
      - 'deploy/check-worker-upgrade.test.mjs'
      - 'deploy/worker-upgrade-policy.json'
      - 'deploy/nginx-claude-mem-*.conf.example'
      - 'deploy/test_public_worker_proxy.py'
      - 'docs/REMOTE_WORKER_SURFACE.md'
      - '.github/workflows/claude-mem-platform-ui-contract.yml'
  workflow_dispatch:

jobs:
  viewer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy -p 'test_platform_ui_patch.py' -v
      - run: python -m unittest discover -s deploy -p 'test_updater_contract.py' -v
      - run: python -m unittest discover -s deploy -p 'test_public_worker_proxy.py' -v
      - run: node --test deploy/check-worker-upgrade.test.mjs
      - run: bash -n deploy/claude-mem-weekly-update.sh
      - name: Test classic and React My Work branding
        run: node --test tests/work-view-branding.test.mjs
      - name: Validate official v15.1.0 packaged React bundle
        run: |
          scratch=$(mktemp -d)
          npm pack claude-mem@15.1.0 --silent --pack-destination "$scratch"
          tar -xzf "$scratch/claude-mem-15.1.0.tgz" -C "$scratch" package/plugin/ui/work-view package/plugin/ui/viewer.html
          ROOT="$scratch/package"
          if CLAUDE_MEM_BRANDING_NO_ICON_DOWNLOAD=1 node deploy/apply-claude-mem-viewer-branding.mjs --root "$ROOT" --check; then
            echo "Unpatched upstream bundle unexpectedly passed"; exit 1
          fi
          CLAUDE_MEM_BRANDING_NO_ICON_DOWNLOAD=1 node deploy/apply-claude-mem-viewer-branding.mjs --root "$ROOT"
          node deploy/apply-claude-mem-viewer-branding.mjs --root "$ROOT" --check
          js=$(find "$ROOT/plugin/ui/work-view/assets" -maxdepth 1 -name 'index-*.js' -print -quit)
          test -n "$js"
          node --check "$js"
          test "$(find "$ROOT/plugin/ui/work-view/assets/agents" -name 'bridge-*.svg' | wc -l)" -eq 8
          original=$(sha256sum "$js" | cut -d' ' -f1)
          CLAUDE_MEM_BRANDING_NO_ICON_DOWNLOAD=1 node deploy/apply-claude-mem-viewer-branding.mjs --root "$ROOT"
          test "$original" = "$(sha256sum "$js" | cut -d' ' -f1)"

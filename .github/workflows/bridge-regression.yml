name: Claude-mem bridge regression

on:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  bridge-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          node --check deploy/apply-claude-mem-viewer-branding.mjs
          node --check chatgpt-mcp/server.mjs
          python -m py_compile deploy/reapply-claude-mem-platform-ui.py hermes-provider/__init__.py
      - name: My Work and Viewer overlays
        run: node --test tests/work-view-branding.test.mjs
      - name: Hermes and Worker identity contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
